name: Build Corz Client JAR

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Gradle & Generate Wrapper
        run: |
          sudo apt-get update && sudo apt-get install -y gradle
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload Compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: CorzClient-Mod-JAR
          path: build/libs/*.jar
